apiVersion: v1
kind: Pod
metadata:
  name: env-advanced2
  namespace: final-prep
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["/bin/sh", "-c", "sleep 3600"]
    envFrom:
      - configMapRef:
          name: app-config
        prefix: CONFIG_ 
    env:
      - name: DATABASE_USER
        valueFrom:
          secretKeyRef:
            key: username
            name: database-secret
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: database-secret
      - name: APP_ENVIRONMENT
        value: testing
      - name: CONFIG_APP_MODE
        value: development
