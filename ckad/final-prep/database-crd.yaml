apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.training.ckad.io 
spec:
  group: training.ckad.io 
  scope: Namespaced
  names:
    plural: databases
    singular: database
    shortNames: 
    - db
    kind: Database
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
              - databaseName
              - engine
              - environment
            properties:
              databaseName:
                type: string
              engine:
                type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 10
              port:
                type: integer
                minimum: 1024
                maximum: 65535
              storageSize:
                type: string
              environment:
                type: string
                enum:
                  - development
                  - testing
                  - production
              backupEnabled:
                type: boolean
          status:
            type: object
            properties:
              availableReplicas:
                type: integer
