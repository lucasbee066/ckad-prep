apiVersion: v1
kind: Pod
metadata:
  name: secret-fromenv 
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: fromenv 
    image: busybox
    envFrom:
    - secretRef:
        name: ckad-secret
    #command: ["sh", "-c", "printenv"]
    command: ["sh", "-c"]
    args:
      - |
        echo "DB-HOST: $DB_Host"
        echo "DB-PASS: $DB_Password"
        echo "Database: $Database"
  restartPolicy: Never
