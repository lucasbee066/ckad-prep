apiVersion: v1
kind: Pod
metadata:
  name: secret-valuefrom 
spec:
  containers:
    - name: valuefrom 
      image: busybox
      command: ["sh", "-c"]
      env:
        - name: password
          valueFrom:
            secretKeyRef:
              name: app-secret-from-file
              key: password
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Pods-Password: $password"
  restartPolicy: Never
