apiVersion: v1
kind: Pod
metadata:
  name: secret-volumemount 
spec:
  containers:
    - name: sec-ctx-demo
      image: busybox
      volumeMounts:
        - name: secret-volume 
          mountPath: /etc/secrets
          readOnly: true
      command: ["sh", "-c"]
      args:
        - |
          echo "Secret files:"
          ls -l /etc/secrets
          echo
          echo "DB_Host:"
          cat /etc/secrets/DB_Host
          sleep 3600
  restartPolicy: Never
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret-from-env-file 
