apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue 
  annotations:
    kubernetes.io/change-cause: "Adding a label for revision 1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web 
        version: blue
    spec:
      initContainers:
      - name: blue-init
        image: busybox
        volumeMounts:
          - name: html
            mountPath: /html
        #command: [/"bin/sh", "-c", "echo '<h1>BLUE DEPLOYMENT</h1>' > /html/index.html"]
        command: ["/bin/sh", "-c"]
        args:
          - echo '<h1>BLUE DEPLOYMENT</h1>' > /html/index.html
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: website-port
          protocol: TCP
        volumeMounts:
          - name: html
            mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
