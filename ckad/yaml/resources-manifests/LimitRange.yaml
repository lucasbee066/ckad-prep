apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-resource-constraint
  namespace: ckad-resources
spec:
  limits:
  - default: # this section defines default limits
      cpu: 500m
      memory: "256Mi"
    defaultRequest: # this section defines default requests
      cpu: 250m
      memory: 128Mi
    max: # max and min define the limit range
      cpu: "1"
      memory: 512Mi
    min:
      cpu: 100m
      memory: 64Mi
    type: Container
