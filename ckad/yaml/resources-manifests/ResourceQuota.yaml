apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-counts
  namespace: ckad-resources
spec:
  hard:
    configmaps: "2"
    persistentvolumeclaims: "4"
    pods: "4"
    replicationcontrollers: "20"
    secrets: "10"
    services: "10"
