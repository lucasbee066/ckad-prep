apiVersion: v1
kind: Service
metadata:
  namespace: website
  labels:
    app: nginx-nodeport
  name: nginx-nodeport
spec:
  ports:
  - name: http 
    port: 80
    protocol: TCP
    targetPort: website-port
    nodePort: 30080
  selector:
    app: ckad-web
  type: NodePort
status:
  loadBalancer: {}
