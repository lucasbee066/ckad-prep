apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: "2026-08-09T01:10:47Z"
  generation: 1
  labels:
    run: webapp-color-cm-fromfile
  name: webapp-color-cm-fromfile
  namespace: pod-configmaps
spec:
  containers:
  - name: webapp-color-cm-fromfile
    image: nginx
    imagePullPolicy: Always
    volumeMounts:
      - name: ngx-cm
        readOnly: false
        mountPath: /etc/app
    command: ["/bin/sh", "-c"]
    args:
      - |
        . /etc/app/app.conf
        echo "color: $color"
        echo "mode: $mode"
        exec nginx -g 'daemon off;'
